# Continuous integration and deployment (PRD section 11).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Lint waits on OPEN_QUESTIONS.md item 35 (typescript-eslint doesn't support TypeScript 7 yet).
      - run: pnpm test
      - run: pnpm test:database
      - run: pnpm test:database:before-after
      - run: pnpm exec vite build

  # Publishes the site to Cloudflare Pages after every push to main whose checks all pass, so a
  # broken build or a failing test never reaches caribbeantender.com. One deploy at a time.
  # The build's public settings come from .env.production in the repo. Needs two repository
  # secrets (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN (Cloudflare Pages:
  # Edit) and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    # Records each deploy under the repo's Deployments, with a link to the live site.
    environment:
      name: production
      url: https://caribbeantender.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Deploys wait for each other but aren't ordered: an older commit whose checks finished last must
      # not replace a newer one on the live site.
      - name: Skip unless this is still the newest commit on main
        id: newest
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main, so its own run deploys instead."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - name: Deploy to Cloudflare Pages
        if: steps.newest.outputs.is_newest == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=caribbeantender --branch=main --commit-dirty=true

  # The RLS suite runs against the client's project (OPEN_QUESTIONS.md, decision D1), so only when
  # started by hand from the Actions tab. It snapshots the row counts first and checks them after.
  live-rls:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    # A hung request would otherwise hold test accounts on production for GitHub's six-hour limit.
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: not-used-by-management-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.102.0
      - name: Link the CLI and write the settings file
        run: |
          supabase link --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}"
          {
            echo "PRODUCTION_PROJECT_REF=${{ secrets.PRODUCTION_PROJECT_REF }}"
            echo "PRODUCTION_SUPABASE_URL=${{ secrets.PRODUCTION_SUPABASE_URL }}"
            echo "PRODUCTION_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}"
            echo "PRODUCTION_SUPABASE_SECRET_KEY=${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}"
          } > .env.production.local
      - run: node scripts/export-project-data.ts backups/ci-before
      - name: Run the live suite
        run: node --env-file=.env.production.local scripts/run-rls.ts live --after-state-only backups/ci-before | tee rls-output.txt
      # run-rls cleans up after itself, but not when the job is cancelled or times out mid-run.
      - name: Remove this run's test data, whatever happened
        if: always()
        run: |
          run_id="$(grep -oE 'run [0-9]{14}' rls-output.txt | head -1 | grep -oE '[0-9]{14}' || true)"
          if [ -n "$run_id" ]; then node --env-file=.env.production.local scripts/cleanup-rls-test-data.ts "$run_id"; fi
